<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waffle Crave</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Lobster+Two:ital,wght@1,700&display=swap">
<style>
:root{--choc:#2b1309;--bg:#fff8e8;--card:#fffdf5;--ink:#2b1309;--mute:#7a5a46;--gold:#e9b02f;--gold-d:#b98410;--red:#d93a45;--line:#ecd9ae;--on-gold:#2b1309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0c05;--card:#2b1309;--ink:#fbecc8;--mute:#c8a98a;--line:#4a2d1d;--gold-d:#e9b02f}}
:root[data-theme="dark"]{--bg:#1c0c05;--card:#2b1309;--ink:#fbecc8;--mute:#c8a98a;--line:#4a2d1d;--gold-d:#e9b02f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--choc);color:#fff8e8;text-align:center;padding:34px 20px 0;position:relative}
.logo{width:168px;height:168px;border-radius:50%;display:block;margin:0 auto 16px;border:3px solid var(--gold);box-shadow:0 0 0 7px var(--choc),0 0 0 9px var(--gold)}
.hero h1{margin:14px 0 4px;font:italic 700 clamp(40px,10vw,58px)/1 'Lobster Two',cursive}
.hero p{margin:0;letter-spacing:.14em;color:var(--gold);font-weight:500;font-size:14px}
.drip{display:block;width:100%;height:46px;margin-top:22px;color:var(--bg)}
main{max-width:980px;margin:auto;padding:6px 18px 130px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;white-space:nowrap;color:var(--mute);font-weight:500}
.tab[aria-pressed=true]{color:var(--ink);border-color:var(--gold)}
h2.cat{font:italic 700 30px 'Lobster Two',cursive;color:var(--gold-d);margin:26px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.item{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:26px;overflow:hidden}
.pic{position:relative;aspect-ratio:4/3;background:#f4dfaa;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.price{position:absolute;left:12px;bottom:12px;background:var(--choc);color:#fff8e8;border:1.5px solid var(--gold);border-radius:999px;padding:2px 14px;font-weight:600;font-size:17px}
.badge{position:absolute;right:12px;top:12px;background:var(--red);color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.body h3{margin:0 0 4px;font:italic 700 27px/1.1 'Lobster Two',cursive}
.body p{margin:0;color:var(--mute);font-size:15px;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.tag{font-size:12.5px;font-weight:500;color:var(--gold-d);border:1px solid var(--gold);border-radius:999px;padding:1px 10px}
.add{border:0;background:var(--gold);color:var(--on-gold);border-radius:999px;padding:9px 22px;font-weight:600}
.add:active{transform:scale(.96)}
.add.ok{background:var(--choc);color:var(--gold)}
.thumb{width:50px;height:50px;border-radius:14px;overflow:hidden;border:2px solid var(--gold);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none}
.bar.show{display:block}
.bar button{width:100%;max-width:700px;margin:auto;display:flex;justify-content:space-between;border:2px solid var(--gold);border-radius:999px;background:var(--choc);color:#fff8e8;padding:15px 24px;font-weight:600;font-size:17px;box-shadow:0 8px 24px rgba(43,19,9,.4)}
.bar b{color:var(--gold)}
dialog{border:0;border-radius:24px;padding:0;width:min(520px,94vw);max-height:90vh;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(28,12,5,.7)}
.dlg{padding:22px}
.dlg h2{margin:0 0 10px;font:italic 700 32px 'Lobster Two',cursive;color:var(--gold-d)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1}.row small{color:var(--mute)}
.q{display:flex;align-items:center;gap:9px}
.q button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:600;padding:14px 0}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0}
.seg input{position:absolute;opacity:0;width:1px}
.seg span{display:block;text-align:center;padding:10px;border:2px solid var(--line);border-radius:999px;background:var(--card)}
.seg input:checked+span{background:var(--choc);color:#fff8e8;border-color:var(--gold)}
.seg input:focus-visible+span{outline:3px solid var(--gold)}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:999px;background:var(--gold);color:var(--on-gold);font-weight:600;font-size:17px}
.ghost{background:none;border:0;color:var(--mute);margin-top:6px;width:100%;padding:8px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:6px 0 0}
.empty{color:var(--mute);padding:18px 0;text-align:center}
footer{text-align:center;color:var(--mute);padding:0 20px 150px;font-size:14px}
footer svg{width:22px;height:22px;color:var(--gold);display:block;margin:0 auto 6px}
</style>
</head>

var cart = {}, cat = "All";
var $ = function(id){return document.getElementById(id)};
function money(n){return SHOP.cur + n}
try{var s=localStorage.getItem("wc-cart"); if(s) cart=JSON.parse(s)||{}}catch(e){}
function save(){try{localStorage.setItem("wc-cart",JSON.stringify(cart))}catch(e){}}
function cats(){return MENU.map(function(m){return m.c}).filter(function(v,i,a){return a.indexOf(v)===i})}
function tabs(){
 $("tabs").innerHTML=["All"].concat(cats()).map(function(c){return '<button class="tab" aria-pressed="'+(c===cat)+'" data-c="'+c+'">'+c+'</button>'}).join("");
}
function art(id){var m=MENU.filter(function(x){return x.id===id})[0];return '<img src="'+IMG[id]+'" alt="'+m.n+'" decoding="async">'}
function menu(){
 $("menu").innerHTML=cats().filter(function(c){return cat==="All"||c===cat}).map(function(c){
  return '<h2 class="cat">'+c+'</h2><div class="grid">'+MENU.filter(function(m){return m.c===c}).map(function(m){
   return '<article class="item"><div class="pic">'+art(m.id)+'<span class="price">'+money(m.p)+'</span>'+(m.b?'<span class="badge">Best seller</span>':'')+'</div><div class="body"><h3>'+m.n+'</h3><p>'+m.d+'</p><div class="foot"><span class="tag">'+m.g+'</span><button class="add" data-id="'+m.id+'" aria-label="Add '+m.n+' to order">Add</button></div></div></article>'}).join("")+'</div>'}).join("");
}
function totals(){var n=0,t=0;MENU.forEach(function(m){var q=cart[m.id]||0;n+=q;t+=q*m.p});return {n:n,t:t}}
function bar(){
 var x=totals();$("bar").classList.toggle("show",x.n>0);
 $("cnt").textContent="View order ("+x.n+" item"+(x.n>1?"s":"")+")";$("sub").textContent=money(x.t);
}
function cartView(){
 var x=totals();
 if(!x.n){$("dbody").innerHTML='<h2>Your order</h2><p class="empty">Nothing here yet. Add a waffle to start.</p><button class="ghost" data-close>Back to menu</button>';return}
 var rows=MENU.filter(function(m){return cart[m.id]}).map(function(m){
  return '<div class="row"><span class="thumb">'+art(m.id)+'</span><span class="n">'+m.n+'<br><small>'+money(m.p)+' each</small></span><span class="q"><button data-dec="'+m.id+'" aria-label="Remove one '+m.n+'">−</button><b>'+cart[m.id]+'</b><button data-inc="'+m.id+'" aria-label="Add one '+m.n+'">+</button></span></div>'}).join("");
 $("dbody").innerHTML='<h2>Your order</h2>'+rows+'<div class="tot"><span>Total</span><span>'+money(x.t)+'</span></div>'+
 '<label for="nm">Your name</label><input id="nm" autocomplete="name">'+
 '<label for="ph">Phone number</label><input id="ph" type="tel" autocomplete="tel">'+
 '<label>How do you want it?</label><div class="seg"><label><input type="radio" name="mode" value="Pickup" checked><span>Pickup</span></label><label><input type="radio" name="mode" value="Delivery"><span>Delivery</span></label></div>'+
 '<div id="addrw" hidden><label for="ad">Delivery address</label><textarea id="ad" rows="2"></textarea></div>'+
 '<label for="nt">Notes (optional)</label><input id="nt" placeholder="Less sweet, extra syrup...">'+
 '<p class="err" id="err" role="alert"></p><button class="go" id="send">Send order on WhatsApp</button><button class="ghost" data-close>Keep browsing</button>';
}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();bar();cartView()}
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.dataset.c){cat=t.dataset.c;tabs();menu()}
 else if(t.classList.contains("add")){change(+t.dataset.id,1);t.textContent="Added";t.classList.add("ok");setTimeout(function(){t.textContent="Add";t.classList.remove("ok")},700)}
 else if(t.id==="openCart"){cartView();$("dlg").showModal()}
 else if(t.dataset.inc)change(+t.dataset.inc,1);
 else if(t.dataset.dec)change(+t.dataset.dec,-1);
 else if(t.hasAttribute("data-close"))$("dlg").close();
 else if(t.id==="send")send();
});
document.addEventListener("change",function(e){if(e.target.name==="mode")$("addrw").hidden=e.target.value!=="Delivery"});
function send(){
 var nm=$("nm").value.trim(),ph=$("ph").value.trim(),mode=document.querySelector('input[name=mode]:checked').value,ad=$("ad").value.trim();
 if(!nm||ph.replace(/\D/g,"").length<8){$("err").textContent="Enter your name and a valid phone number.";return}
 if(mode==="Delivery"&&!ad){$("err").textContent="Enter a delivery address.";return}
 var x=totals(),lines=MENU.filter(function(m){return cart[m.id]}).map(function(m){return cart[m.id]+" x "+m.n+" - "+money(cart[m.id]*m.p)});
 var msg="New order for "+SHOP.name+"\n\n"+lines.join("\n")+"\n\nTotal: "+money(x.t)+"\n"+mode+(mode==="Delivery"?" to: "+ad:"")+"\nName: "+nm+"\nPhone: "+ph+($("nt").value.trim()?"\nNotes: "+$("nt").value.trim():"");
 window.open("https://wa.me/"+SHOP.whatsapp+"?text="+encodeURIComponent(msg),"_blank");
 cart={};save();bar();
 $("dbody").innerHTML='<h2>Order sent</h2><p>Finish sending the message in WhatsApp and we will confirm shortly.</p><button class="go" data-close>Back to menu</button>';
}
tabs();menu();bar();
</script>
</body>
</html>
